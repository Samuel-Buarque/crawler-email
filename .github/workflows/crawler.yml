name: Daily Job Crawler

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write # Permissão essencial para fazer o commit de volta no repositório

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Job Crawler
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: python crawler.py

    - name: Commit e Push das vagas enviadas
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git add vagas_enviadas.json
        # O comando || echo evita que o workflow falhe se não houver novas vagas para comitar
        git commit -m "Atualiza registo de vagas enviadas [skip ci]" || echo "Sem alterações para comitar"
        git push
